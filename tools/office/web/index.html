<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office floor</title>
  <style>
    :root { --panel: clamp(300px, 36vw, 390px); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: system-ui, sans-serif; color: #e6e9f5; }
    #floor { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; top: 16px; left: 16px; pointer-events: none; }
    /* The panel never hides the floor: the scene shifts to the free side. */
    body.panel-open #floor { width: calc(100% - var(--panel) - 32px); }
    @media (max-width: 700px) { body.panel-open #floor { width: 100%; } }
  </style>
  <script type="importmap">{ "imports": { "three": "/web/vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="floor"></canvas>
  <div id="hud"></div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>

<text class="ts plain" x="222" y="581" dominant-baseline="central">judges</text>
<rect class="key-gray" x="300" y="574" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts plain" x="322" y="581" dominant-baseline="central">orchestrates, the human, or ends the run</text>
</svg>

<rect x="540" y="488" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="507" text-anchor="middle" dominant-baseline="central">Human</text>
<text class="ts" x="590" y="527" text-anchor="middle" dominant-baseline="central">escalation</text>
